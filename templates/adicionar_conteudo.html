{% extends 'base.html' %}

{% block content %}
<div class="container" style="max-width: 800px; padding: 40px 20px;">
    <h2 style="color: var(--cor-primaria); margin-bottom: 30px;">Adicionar Nova Aula</h2>
    
    <div class="content-box"> <form method="POST" action="{{ url_for('content.add_lesson') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-group">
                <label class="form-label">Título da Aula</label>
                <input type="text" name="titulo" class="form-control" required placeholder="Ex: Introdução à Álgebra">
            </div>
            
            <div class="form-group">
                <label class="form-label">Módulo/Conteúdo</label>
                <select name="content_id" class="form-control" required>
                    <option value="" disabled selected>Selecione um módulo...</option>
                    {% for content in contents %}
                    <option value="{{ content.id }}">{{ content.subject.name }} > {{ content.title }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">URL do Vídeo (MP4 ou Link)</label>
                <input type="text" name="video_url" class="form-control" placeholder="http://...">
            </div>
            
            <div class="form-group">
                <label class="form-label">Duração (minutos)</label>
                <input type="number" name="duracao" class="form-control" style="width: 150px;">
            </div>
            
            <div class="form-group">
                <label class="form-label">Descrição (Texto da Aula)</label>
                <textarea name="descricao" class="form-control" rows="5"></textarea>
            </div>
            
            <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" name="gratis" id="gratis" style="width: auto;">
                <label for="gratis" style="margin: 0; cursor: pointer;">Aula Gratuita (Acessível sem assinatura)</label>
            </div>
            
            <button type="submit" class="btn-primary" style="margin-top: 20px;">Salvar Aula</button>
        </form>
    </div>
</div>
{% endblock %}

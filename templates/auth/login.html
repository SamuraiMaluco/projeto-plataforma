{% extends "base.html" %}

{% block body_class %}auth-page login-page{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-card__header">
            <i class="fas fa-graduation-cap"></i>
            <h1>Acesse sua conta</h1>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="email" class="form-label">
                    <i class="fas fa-envelope"></i> E-mail
                </label>
                <input type="email" id="email" name="email" class="form-control" 
                    placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fas fa-lock"></i> Senha
                </label>
                <input type="password" id="password" name="password" 
                    class="form-control" placeholder="••••••••" required>
                
                <div class="form-actions">
                    </div>
            </div>

            <div class="form-group">
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </div>
        </form>

        <div class="auth-card__footer">
            <p>Não tem uma conta? <a href="{{ url_for('auth.register') }}">Cadastre-se</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
import { AuthService } from '/static/js/services/auth.service.js';

document.addEventListener('DOMContentLoaded', () => {
    const authService = new AuthService();
    
    // Validação do formulário
    const form = document.querySelector('.auth-form');
    if (form) {
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(form);
            try {
                const response = await authService.login({
                    email: formData.get('email'),
                    password: formData.get('password')
                });
                
                // Redirecionamento após login
                window.location.href = response.redirect || '/';
            } catch (error) {
                // Tratamento de erro
                console.error('Login error:', error);
            }
        });
    }
});
</script>
{% endblock %}
